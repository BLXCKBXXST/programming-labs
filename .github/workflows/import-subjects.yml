name: Import SAOD and web technologies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-subjects.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Copy the two coursework repositories
        shell: bash
        run: |
          set -euo pipefail

          if [[ -e saod || -e web-technologies ]]; then
            echo "An import directory already exists; refusing to overwrite it."
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          git clone --quiet --depth 1 --branch main \
            https://github.com/BLXCKBXXST/data-structures-and-algorithms.git \
            "$tmp/saod"
          git clone --quiet --depth 1 --branch main \
            https://github.com/BLXCKBXXST/web-technologies-labs.git \
            "$tmp/web-technologies"

          test "$(git -C "$tmp/saod" rev-parse HEAD)" = \
            "7d745af6e309547ad538313c7976fea47c9bb960"
          test "$(git -C "$tmp/web-technologies" rev-parse HEAD)" = \
            "9b10a8472eecee28441de8a90ea703f4a76c6ec6"

          mkdir -p saod web-technologies
          cp -a "$tmp/saod/." saod/
          cp -a "$tmp/web-technologies/." web-technologies/
          rm -rf saod/.git web-technologies/.git

          python3 - <<'PY'
          from pathlib import Path
          readme = Path("web-technologies/README.md")
          source = readme.read_text(encoding="utf-8")
          source = source.replace(
              "https://github.com/BLXCKBXXST/web-technologies-labs/tree/main/",
              "https://github.com/BLXCKBXXST/Subjects/tree/main/web-technologies/",
          ).replace(
              "https://github.com/BLXCKBXXST/web-technologies-labs/blob/main/",
              "https://github.com/BLXCKBXXST/Subjects/blob/main/web-technologies/",
          )
          readme.write_text(source, encoding="utf-8")
          PY

          cat > README.md <<'EOF'
          # Предметы

          Лабораторные, методички и другие учебные работы. Всё разложено по предметам:

          - [Программирование](programming/) — C, немного C++, РГР.
          - [ООП](oop/) — лабораторные на C++ и PDF-методички.
          - [САОД](saod/) — сортировки, поиск, списки и хеширование.
          - [Веб-технологии](web-technologies/) — серверные лабораторные, веб-дизайн, JavaScript и РГЗ.

          Сборка и материалы — внутри соответствующих папок.
          EOF

          git add -f -A -- saod web-technologies README.md

          src_saod="$(git -C "$tmp/saod" ls-files | wc -l)"
          dst_saod="$(git ls-files -- saod | wc -l)"
          src_web="$(git -C "$tmp/web-technologies" ls-files | wc -l)"
          dst_web="$(git ls-files -- web-technologies | wc -l)"
          echo "SAOD: $src_saod source files, $dst_saod imported"
          echo "Web:  $src_web source files, $dst_web imported"
          test "$src_saod" -eq "$dst_saod"
          test "$src_web" -eq "$dst_web"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add SAOD and web technologies coursework"
          git push origin HEAD:main
